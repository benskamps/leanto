<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>leanto — popsicle-stick sandbox</title>
<meta name="description" content="A tiny popsicle-stick physics toy. Grab sticks, prop them up, glue them, snip them — then drop your build into live physics and watch it stand, or fall. There's a cottage waiting inside." />
<link rel="canonical" href="https://www.brokenbranch.dev/leanto/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23efe9df'/%3E%3Cg stroke='%23b07a3c' stroke-width='3.5' stroke-linecap='round'%3E%3Cline x1='7' y1='26' x2='16' y2='8'/%3E%3Cline x1='25' y1='26' x2='16' y2='8'/%3E%3C/g%3E%3Cline x1='4' y1='27' x2='28' y2='27' stroke='%236f5337' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="brokenbranch" />
<meta property="og:title" content="leanto — a popsicle-stick physics toy" />
<meta property="og:description" content="Grab sticks, prop them, glue them, snip them — then press B and watch your build stand or fall. Load the cottage; then build yours." />
<meta property="og:url" content="https://www.brokenbranch.dev/leanto/" />
<meta property="og:image" content="https://www.brokenbranch.dev/leanto/assets/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<meta name="twitter:title" content="leanto — a popsicle-stick physics toy" />
<meta name="twitter:description" content="Grab sticks, prop them, glue them, snip them — then press B and watch your build stand or fall. Load the cottage; then build yours." />

<style>
  :root {
    --ink:#382a1d; --muted:#6f5d4b; --paper:#f4ecdf; --paper-solid:#f7f0e5;
    --amber:#b9782f; --amber-soft:#e8c58c; --rust:#8b3d29; --line:rgba(56,42,29,.18);
    --shadow:0 10px 34px rgba(38,23,10,.16);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--paper);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  button { color:inherit; font:inherit; }
  button:focus-visible { outline:3px solid rgba(185,120,47,.42); outline-offset:3px; }
  canvas { display:block; touch-action:none; }
  #workbench { position:fixed; inset:0; z-index:8; pointer-events:none; }
  .brand { position:absolute; left:14px; top:12px; pointer-events:none; padding:9px 14px 10px; border-radius:14px;
    background:rgba(247,240,229,.78); backdrop-filter:blur(10px); box-shadow:0 4px 16px rgba(38,23,10,.07); }
  .brand h1 { margin:0; font:700 22px/1 ui-serif,Georgia,"Times New Roman",serif; letter-spacing:.01em; }
  .brand p { margin:5px 0 0; font:italic 12px/1.2 ui-serif,Georgia,serif; color:var(--muted); }
  #status { margin-top:8px; max-width:220px; font:10px/1.3 ui-monospace,"Cascadia Code",monospace;
    color:var(--muted); }
  /* BUILD ⇄ RUN: a two-position switch. The thumb slides to the live mode; RUN warms to rust. */
  #mode-toggle { position:absolute; left:50%; top:14px; transform:translateX(-50%);
    display:grid; grid-template-columns:1fr 1fr auto; align-items:center; pointer-events:auto; cursor:pointer;
    border:1px solid var(--line); border-radius:999px; padding:4px; gap:0;
    background:rgba(247,240,229,.9); box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 22px rgba(38,23,10,.12);
    backdrop-filter:blur(12px); transition:border-color .25s,box-shadow .25s,transform .18s; }
  #mode-toggle:hover { transform:translateX(-50%) translateY(-1px); box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 9px 26px rgba(38,23,10,.16); }
  #mode-toggle:active { transform:translateX(-50%) scale(.98); }
  .mode-thumb { position:absolute; left:4px; top:4px; bottom:4px; width:var(--seg,74px); border-radius:999px;
    background:var(--ink); box-shadow:0 2px 8px rgba(38,23,10,.28);
    transition:transform .34s cubic-bezier(.3,1.4,.5,1),background .25s; }
  .mode-seg { position:relative; z-index:1; width:var(--seg,74px); height:30px; display:flex; align-items:center;
    justify-content:center; gap:6px; color:var(--muted);
    font:700 11px/1 ui-monospace,"Cascadia Code",monospace; letter-spacing:.12em; text-transform:uppercase;
    transition:color .25s; }
  .mode-seg svg { width:13px; height:13px; flex:none; }
  [data-world="build"] .mode-seg[data-seg="build"], [data-world="run"] .mode-seg[data-seg="run"] { color:var(--paper-solid); }
  [data-world="run"] .mode-thumb { transform:translateX(100%); background:var(--rust); }
  [data-world="run"] #mode-toggle { border-color:rgba(139,61,41,.4);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 0 0 4px rgba(139,61,41,.12), 0 6px 22px rgba(38,23,10,.14); }
  .mode-key { position:relative; z-index:1; margin:0 6px 0 4px; min-width:18px; height:18px; display:grid; place-items:center;
    border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; color:var(--muted);
    font:600 10px/1 ui-monospace,"Cascadia Code",monospace; }
  .top-actions { position:absolute; right:16px; top:14px; display:flex; gap:7px; pointer-events:auto; }
  .icon-button { width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--line);
    border-radius:50%; cursor:pointer; background:rgba(247,240,229,.9); box-shadow:0 4px 15px rgba(38,23,10,.08);
    transition:transform .16s,background .16s; }
  .icon-button:hover { transform:translateY(-1px); background:var(--paper-solid); }
  .icon-button:disabled { opacity:.35; cursor:not-allowed; transform:none; }
  #context-hint { position:absolute; left:50%; top:62px; transform:translateX(-50%); margin:0;
    max-width:min(520px,calc(100vw - 32px)); padding:7px 12px; border-radius:8px;
    background:rgba(247,240,229,.88); color:var(--muted); pointer-events:none;
    font:italic 13px/1.25 ui-serif,Georgia,serif; box-shadow:0 4px 18px rgba(38,23,10,.08);
    backdrop-filter:blur(8px); transition:opacity .18s,transform .18s; text-align:center; }
  .tool-rail { position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; align-items:stretch; gap:3px; padding:5px; pointer-events:auto;
    border:1px solid var(--line); border-radius:16px; background:rgba(247,240,229,.94);
    box-shadow:var(--shadow); backdrop-filter:blur(12px); }
  .tool { min-width:62px; height:52px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:3px; border:0; border-radius:11px; background:transparent;
    cursor:pointer; color:var(--muted); transition:background .16s,color .16s,transform .16s; }
  .tool:hover { color:var(--ink); background:rgba(56,42,29,.06); transform:translateY(-1px); }
  .tool.active { color:var(--ink); background:rgba(185,120,47,.16); }
  .tool:disabled { opacity:.32; cursor:not-allowed; transform:none; }
  .tool .glyph { font:700 18px/1 ui-serif,Georgia,serif; }
  .tool .label { font:600 10px/1 ui-sans-serif,system-ui,sans-serif; }
  #help-panel { position:fixed; inset:0; z-index:30; pointer-events:auto;
    background:rgba(36,23,12,.24); backdrop-filter:blur(4px); }
  .help-sheet { position:absolute; right:0; top:0; bottom:0; width:min(410px,100%);
    overflow:auto; padding:26px 28px 34px; background:var(--paper-solid); box-shadow:-16px 0 45px rgba(38,23,10,.2); }
  .help-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }
  .help-head h2 { margin:0; font:700 24px/1 ui-serif,Georgia,serif; }
  .help-sheet > p { margin:8px 0 20px; color:var(--muted); font:italic 13px/1.45 ui-serif,Georgia,serif; }
  #help-list { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  #help-list li { display:flex; align-items:center; justify-content:space-between; gap:18px;
    padding:11px 0; border-bottom:1px solid var(--line); font-size:12px; }
  #help-list span { font-weight:650; }
  kbd { color:var(--muted); font:10px/1.2 ui-monospace,"Cascadia Code",monospace; text-align:right; }
  .showcase { width:100%; margin-top:22px; padding:11px 14px; border:1px solid var(--line);
    border-radius:10px; background:transparent; cursor:pointer; color:var(--amber); font:italic 13px ui-serif,Georgia,serif; }
  #loading { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    font:italic 20px ui-serif,Georgia,serif; color:var(--muted); }
  #err { position:fixed; left:16px; bottom:16px; right:16px; z-index:50; color:#7a1f1f;
    background:var(--paper-solid); padding:12px; border-radius:8px; font:12px ui-monospace,monospace;
    white-space:pre-wrap; display:none; }
  @media (max-width:700px) {
    .brand { left:10px; top:10px; padding:7px 11px; }
    .brand h1 { font-size:20px; }
    .brand p,#status { display:none; }
    #mode-toggle { top:10px; --seg:64px; }
    .mode-key { display:none; }
    .mode-seg { height:28px; }
    .top-actions { right:10px; top:10px; gap:5px; }
    .top-actions .icon-button { width:34px; height:34px; }
    #undo-button, #redo-button { display:none; }
    #context-hint { top:57px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tool-rail { bottom:10px; width:calc(100vw - 16px); justify-content:space-around; gap:0; padding:4px; }
    .tool { min-width:0; flex:1; height:48px; }
    .tool .label { font-size:9px; }
    .tool .glyph { font-size:17px; }
  }
  /* the room's edges fall off like a lamp-lit photo; deeper as the dial turns to evening */
  body::after { content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 95% at 50% 46%, transparent 55%, rgba(40,22,8,calc(.16 + var(--dusk,0)*.3)) 100%); }
  #loading { flex-direction:column; gap:18px; background:radial-gradient(80% 70% at 50% 45%, #f8f1e6, #eadbc4); }
  .whittle { width:84px; height:56px; }
  .whittle line { stroke:var(--amber); stroke-width:5; stroke-linecap:round; transform-box:fill-box; }
  .whittle .l { transform-origin:100% 0; animation:lean 1.6s cubic-bezier(.4,1.5,.5,1) infinite alternate; }
  .whittle .r { transform-origin:0 0; animation:lean 1.6s cubic-bezier(.4,1.5,.5,1) infinite alternate-reverse; }
  .whittle .t { stroke:var(--ink); stroke-width:3; opacity:.35; }
  @keyframes lean { from { transform:rotate(-7deg); } to { transform:rotate(4deg); } }
  /* daylight: a vertical slider on the right edge; the sun sets downward */
  .daylight { position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 7px; border-radius:999px;
    border:1px solid var(--line); background:rgba(247,240,229,.82); backdrop-filter:blur(10px);
    box-shadow:0 4px 16px rgba(38,23,10,.1); cursor:pointer; color:var(--muted); font-size:13px; line-height:1; }
  .daylight input { -webkit-appearance:none; appearance:none; writing-mode:vertical-lr; direction:ltr;
    width:6px; height:110px; margin:0; border-radius:999px; cursor:pointer;
    background:linear-gradient(#f3c77a, #c0703a 55%, #3a2b20); }
  .daylight input::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--paper-solid); border:2px solid var(--amber); box-shadow:0 1px 4px rgba(38,23,10,.3); }
  .daylight input::-moz-range-thumb { width:13px; height:13px; border-radius:50%;
    background:var(--paper-solid); border:2px solid var(--amber); }
  .daylight input:focus-visible { outline:3px solid rgba(185,120,47,.42); outline-offset:5px; }
  .resume-chip { position:absolute; left:50%; top:104px; transform:translateX(-50%); pointer-events:auto; cursor:pointer;
    padding:7px 14px; border-radius:999px; border:1px solid rgba(185,120,47,.45); background:var(--paper-solid);
    color:var(--ink); box-shadow:var(--shadow); font:italic 13px/1 ui-serif,Georgia,serif; }
  .resume-chip:hover { border-color:var(--amber); }
  @media (max-width:700px) {
    .daylight { right:8px; top:auto; bottom:76px; transform:none; padding:8px 5px; }
    .daylight input { height:72px; }
    .resume-chip { top:96px; }
  }
  /* Skip link: off-screen until a keyboard user focuses it. */
  .skip-link { position:fixed; left:12px; top:-60px; z-index:60; padding:8px 13px; border-radius:8px;
    background:var(--paper-solid); color:var(--ink); border:1px solid var(--amber); box-shadow:var(--shadow);
    font:600 13px/1 ui-sans-serif,system-ui,sans-serif; text-decoration:none; }
  .skip-link:focus { top:12px; outline:3px solid rgba(185,120,47,.42); outline-offset:2px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { scroll-behavior:auto !important; transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>
</head>
<body>
  <a href="#workbench-canvas" class="skip-link">Skip to the workbench</a>
  <div id="loading"><svg class="whittle" viewBox="0 0 84 56" aria-hidden="true"><line class="l" x1="14" y1="50" x2="42" y2="8"/><line class="r" x1="70" y1="50" x2="42" y2="8"/><line class="t" x1="4" y1="52" x2="80" y2="52"/></svg>whittling sticks…</div>
  <div id="workbench" data-world="build" data-tool="hand" hidden>
    <header class="brand">
      <h1>leanto</h1>
      <p>a table, some sticks, and gravity.</p>
      <div id="status" aria-live="polite"></div>
    </header>
    <button id="mode-toggle" type="button">
      <span class="mode-thumb" aria-hidden="true"></span>
      <span class="mode-seg" data-seg="build"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 13 8 3l5 10M2 13h12"/></svg>Build</span>
      <span class="mode-seg" data-seg="run"><svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M5 3.2v9.6L12.6 8z"/></svg>Run</span>
      <kbd class="mode-key" aria-hidden="true">B</kbd>
      <span class="sr-only" id="mode-label">: building, press to run it</span>
    </button>
    <div class="top-actions">
      <button id="undo-button" class="icon-button" type="button" aria-label="Undo" title="Undo">↶</button>
      <button id="redo-button" class="icon-button" type="button" aria-label="Redo" title="Redo">↷</button>
      <button id="sound-toggle" class="icon-button" type="button" aria-label="Turn sound on" aria-pressed="true" title="Sound">♩</button>
      <button id="help-open" class="icon-button" type="button" aria-label="Open controls" aria-expanded="false" title="Controls">?</button>
    </div>
    <p id="context-hint" aria-live="polite">Pick up a stick and lean it on another. Then press Run.</p>
    <nav class="tool-rail" aria-label="Workbench tools">
      <button class="tool active" data-tool="hand" type="button" aria-pressed="true"><span class="glyph">✋</span><span class="label">Hand</span></button>
      <button class="tool" id="add-stick" type="button"><span class="glyph">＋</span><span class="label">Stick</span></button>
      <button class="tool" id="add-ragdoll" type="button"><span class="glyph">♙</span><span class="label">Doll</span></button>
      <button class="tool" data-tool="glue" type="button" aria-pressed="false"><span class="glyph">●</span><span class="label">Glue</span></button>
      <button class="tool" data-tool="snip" type="button" aria-pressed="false"><span class="glyph">✂</span><span class="label">Snip</span></button>
      <button class="tool" data-tool="stamp" type="button" aria-pressed="false"><span class="glyph">⧉</span><span class="label">Duplicate</span></button>
    </nav>
    <div id="help-panel" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
      <section class="help-sheet">
        <div class="help-head">
          <h2 id="help-title">Your hands</h2>
          <button id="help-close" class="icon-button" type="button" aria-label="Close controls">×</button>
        </div>
        <p>The stick carries its controls. Select one, then drag what you want to change.</p>
        <ul id="help-list"></ul>
        <button id="load-cottage" class="showcase" type="button" hidden>⌂ Load the Cottage</button>
      </section>
    </div>
  </div>
  <div id="err"></div>

<script type="module" src="./src/boot.js"></script>

</body>
</html>
